<svg width="420" height="96" viewBox="0 0 420 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .brand { fill:#0B1F3B; font-family: Manrope, Inter, Arial; font-weight:800; }
      .sub { fill:#5B6676; font-family: Manrope, Inter, Arial; font-weight:600; }
      .accent { stroke:#22C55E; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; fill:none;}
      .car { stroke:#0B1F3B; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; fill:none;}
    </style>
  </defs>

  <!-- Icon -->
  <g transform="translate(6,16)">
    <!-- Car outline -->
    <path class="car" d="M8 40 L20 22 H60 L72 40 Z"></path>
    <circle class="car" cx="24" cy="44" r="6"></circle>
    <circle class="car" cx="56" cy="44" r="6"></circle>

    <!-- Check -->
    <path class="accent" d="M82 36 L92 46 L110 24"></path>
  </g>

  <!-- Text -->
  <text x="140" y="48" font-size="34" class="brand">Ritiriamo Auto</text>
  <text x="142" y="72" font-size="16" class="sub">valutazione e ritiro veicoli</text>
</svg>
