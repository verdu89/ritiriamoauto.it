<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160" role="img" aria-label="ritiriamoauto.it">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081a33"></stop>
      <stop offset="1" stop-color="#123a66"></stop>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e"></stop>
      <stop offset="1" stop-color="#16a34a"></stop>
    </linearGradient>
  </defs>

  <!-- car signature line -->
  <path d="
    M110 62
    C150 40, 220 28, 300 28
    C390 28, 470 40, 540 70
    C565 82, 600 88, 640 92" fill="none" stroke="url(#ink)" stroke-width="8" stroke-linecap="round"></path>

  <!-- green speed accent -->
  <path d="
    M120 82
    C260 66, 410 64, 620 84" fill="none" stroke="url(#cta)" stroke-width="7" stroke-linecap="round" opacity="0.95"></path>

  <!-- wheels minimal -->
  <circle cx="260" cy="90" r="8" fill="#0b1220" opacity="0.9"></circle>
  <circle cx="560" cy="92" r="8" fill="#0b1220" opacity="0.9"></circle>

  <!-- wordmark -->
  <text x="80" y="132" font-family="Manrope, Inter, system-ui" font-size="58" font-weight="950" fill="#081a33" letter-spacing="-1.4">
    ritiriamoauto
  </text>

  <text x="560" y="132" font-family="Manrope, Inter, system-ui" font-size="58" font-weight="950" fill="#22c55e" letter-spacing="-1.4">.it</text>
</svg>
